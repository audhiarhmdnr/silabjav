<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XRF Sync</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at 50% 30%, #0f172a 0%, #020617 100%);
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            overflow: hidden;
        }

        .container {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 24px;
            padding: 44px 28px;
            max-width: 380px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.9), 0 0 50px rgba(56, 189, 248, 0.12);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.96) translateY(10px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .icon-wrapper {
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.15) 0%, rgba(14, 165, 233, 0.05) 100%);
            border: 1.5px solid rgba(56, 189, 248, 0.35);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.3rem;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.25);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .container:hover .icon-wrapper {
            transform: scale(1.05);
        }

        h1 {
            font-size: 1.45rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .btn-launch {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            border: 1px solid rgba(56, 189, 248, 0.5);
            color: #ffffff;
            text-decoration: none;
            padding: 16px 20px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 0.3px;
            box-shadow: 0 8px 24px rgba(2, 132, 199, 0.4), 0 0 20px rgba(56, 189, 248, 0.2);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            outline: none;
        }

        .btn-launch:hover, .btn-launch:active {
            background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
            box-shadow: 0 10px 30px rgba(56, 189, 248, 0.5), 0 0 30px rgba(56, 189, 248, 0.3);
            transform: translateY(-2px);
        }

        .btn-secondary-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #94a3b8;
            text-decoration: none;
            padding: 11px 16px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        .btn-secondary-link:hover, .btn-secondary-link:active {
            background: rgba(255, 255, 255, 0.1);
            color: #f1f5f9;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon-wrapper">
            🔬
        </div>

        <h1>XRF Explorer 7000</h1>

        <div class="btn-group">
            <!-- Link 1: Direct Custom URI Scheme (Universal across Android browsers) -->
            <a href="xrf://open" id="btn-open-scheme" class="btn-launch">
                🚀 BUKA APLIKASI
            </a>

            <!-- Link 2: Chrome Android Intent Format -->
            <a href="intent://open#Intent;scheme=xrf;package=com.silab.xrf.sync;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;end" id="btn-open-intent" class="btn-secondary-link">
                🔗 Buka via Chrome Intent
            </a>
        </div>
    </div>

    <script>
        // Auto-redirect jika dibuka langsung di browser Android
        window.addEventListener('DOMContentLoaded', () => {
            if (/Android/i.test(navigator.userAgent)) {
                setTimeout(() => {
                    window.location.href = "xrf://open";
                }, 400);
            }
        });
    </script>
</body>
</html>
